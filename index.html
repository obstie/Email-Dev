<!DOCTYPE html>
<html lang="und" dir="ltr" xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
  <!-- Character encoding -->
  <meta charset="UTF-8">

  <!-- Helps the email adapt to different screen sizes -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Name of the email document -->
  <title>Beats_Headphones</title>

  <!-- Outlook-specific settings -->
  <!--[if mso]>
  <xml>
    <o:OfficeDocumentSettings>
      <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings>
  </xml>
  <![endif]-->

  <!-- Styles used by Outlook ghost tables -->
  <style>
    .mso {
      mso-cellspacing: 0;
      padding: 0;
      font-size: medium;
      font-family: Arial, Helvetica, sans-serif;
    }
  </style>
</head>

<body class="body" style="margin:0; padding:0; background:#413e3e;">

  <!--
    EMAIL WRAPPER
    Wraps the entire email content.
    This is NOT the width container.
  -->
  <div class="wrapper" role="article" aria-label="Beats_Headphones" lang="und" dir="ltr" style="font-size:medium; font-size:max(16px, 1rem);">

    <!--
      OUTER BACKGROUND
      Fills the available width around the email container.
    -->
    <div class="email-background" style="background:#111111;">

      <!--[if mso]>
      <table role="none" class="mso" width="100%" align="center" style="background:#111111;">
        <tr>
          <td></td>
          <td style="width:600px; background:#ffffff; padding:16px;">
      <![endif]-->

      <!--
        MAIN EMAIL CONTAINER
        Controls the maximum width and centres the email.
        On smaller screens it can shrink with the available space.
      -->
      <div class="email-container" style="max-width:600px; margin:0 auto; background:#ffffff; padding:16px; mso-para-margin:0; mso-padding-alt:0;">

        <!--
          EMAIL CONTENT STARTS HERE
          Add your sections inside this container.
        -->
        

      </div>
      <!-- END MAIN EMAIL CONTAINER -->

      <!--[if mso]>
          </td>
          <td></td>
        </tr>
      </table>
      <![endif]-->

    </div>
    <!-- END OUTER BACKGROUND -->

  </div>
  <!-- END EMAIL WRAPPER -->

</body>
</html>
