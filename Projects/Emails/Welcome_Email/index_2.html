<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Email#2</title>
</head>

<!-- [1] the body container is the email environment, we remove all
    unwanted things that the email client/browser add.
    The big ones are default margin and padding -->
<body style="margin: 0; padding: 0; background-color: rgb(202, 202, 201);">

<!-- [2] the email boundary, We need our email to have a predictable width and be centred. -->    
    <div class="wrapper" style="max-width: 600px; margin: 0 auto;">

<!-- [3] This is where our actual email content starts being controlled.
    width: 100%          Use the available width.
    max-width: 600px     But don't exceed 600px.
    margin: 0 auto       Centre it.-->       
        <div class="content_wrapper" style="width: 100%; max-width: 600px; margin: 0 auto;">

        </div>

    </div>
    
</body>
</html>
